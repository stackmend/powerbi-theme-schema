name: Sync official Power BI schema
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schema-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch and verify upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pbitheme.sync
      - run: python -m unittest discover -s tests -v
      - name: Publish verified changes only
        run: |
          git add schemas metadata upstream latest.json
          if git diff --cached --quiet; then
            echo 'No schema changes; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified Microsoft Power BI theme schema'
          git push
      - name: Failure summary
        if: failure()
        run: echo 'Schema sync failed. No verified update was published. Review this run before retrying.' >> "$GITHUB_STEP_SUMMARY"
